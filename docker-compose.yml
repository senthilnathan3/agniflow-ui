version: '3.8'

services:
  www:
    image: node:20-alpine
    container_name: www-app
    working_dir: /app
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - COMPONENTS_REGISTRY_URL=${COMPONENTS_REGISTRY_URL}
      - REGISTRY_URL=${REGISTRY_URL}
      - DEPLOYMENT_PROTECTION_BYPASS=${DEPLOYMENT_PROTECTION_BYPASS}
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: >
      sh -c "
        pnpm install &&
        turbo run dev --filter=www --parallel
      "
    networks:
      - ui-network
      
  redis:
    image: redis:latest
    container_name: redis
    networks:
      - ui-network

networks:
  ui-network:
    driver: bridge
